<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient — Speaking Medicines</title><style>body{margin:0;background:#062f2d;color:#143b37;font:16px Arial}.box{max-width:520px;margin:auto;padding:24px}.card{background:#f8fbf8;border-radius:14px;padding:22px}.warn{color:#a52f23;font-weight:bold}.status{color:#b9d2c9;line-height:1.5}button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:25px;background:#f2672b;color:#fff;font-weight:bold;font-size:16px}.error{background:#fff0eb;padding:15px;color:#8b2a20;border-left:4px solid #a52e22}</style></head><body><main class="box"><h1 style="color:#fff;font:38px Georgia">Speaking Medicines<span style="color:#f2672b">.</span></h1><section class="card" id="card"><p class="status">Loading instructions...</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),id=new URLSearchParams(location.search).get('token'),card=document.getElementById('card'),L={en:{m:'Medicine',d:'Dose',t:'When to take',f:'With food',w:'Warning',play:'Play instructions',call:'Call pharmacist'},hi:{m:'दवा',d:'खुराक',t:'कब लेना है',f:'भोजन के साथ',w:'चेतावनी',play:'निर्देश सुनें',call:'फार्मासिस्ट को कॉल करें'},mr:{m:'औषध',d:'डोस',t:'कधी घ्यायचे',f:'अन्नासोबत',w:'इशारा',play:'सूचना ऐका',call:'फार्मासिस्टला कॉल करा'}};async function load(){if(!id){card.innerHTML='<div class="error">Invalid QR link.</div>';return}let {data,error}=await db.from('medicine_labels').select('*').eq('token',id).eq('revoked',false).maybeSingle();if(error||!data){card.innerHTML='<div class="error">This label is unavailable, revoked or expired.</div>';return}let x=L[data.language]||L.en;card.innerHTML='<h2>'+data.medicine_name+'</h2><p><b>'+x.d+':</b> '+data.dose+'</p><p><b>'+x.t+':</b> '+data.timing+'</p><p><b>'+x.f+':</b> '+data.food+'</p><p class="warn"><b>'+x.w+':</b> '+data.warning+'</p><button id="play">▶ '+x.play+'</button><button id="call">📞 '+x.call+'</button>';let text=data.medicine_name+'. '+data.dose+'. '+data.timing+'. '+data.food+'. '+data.warning;document.getElementById('play').onclick=()=>{let u=new SpeechSynthesisUtterance(text);u.lang={en:'en-IN',hi:'hi-IN',mr:'mr-IN'}[data.language];speechSynthesis.cancel();speechSynthesis.speak(u)};document.getElementById('call').onclick=()=>location.href='tel:'+data.pharmacy_phone}load();</script></body></html>
